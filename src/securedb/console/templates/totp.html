{% extends "base.html" %}
{% block title %}Verification code{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>Verification code</h1>
  <p class="hint">Enter the 6-digit code from your authenticator app.</p>
  <form method="post" action="/console/login/totp" class="stack">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label>Code <input name="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required autocomplete="one-time-code" autofocus></label>
    <button type="submit">Sign in</button>
  </form>
</section>
{% endblock %}
