[project]
name = "securedb"
version = "0.1.0"
description = "Multi-tenant PII vault and tokenization service"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.13",
    "fastapi>=0.115",
    "psycopg[binary]>=3.2",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0.30",
    "structlog>=24.1",
    "typer>=0.12",
    "uvicorn>=0.30",
]

[project.scripts]
securedb = "securedb.cli:app"

[dependency-groups]
dev = [
    "bandit>=1.7.9",
    "httpx>=0.27",
    "mypy>=1.11",
    "pip-audit>=2.7",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/securedb"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "S", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S104", "S105", "S106"]

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "src"
packages = ["securedb"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["securedb"]
branch = true

[tool.uv]
# Prefer an installed (signed) Python over uv-managed builds: Windows Smart App
# Control blocks the unsigned managed builds. CI still falls back to managed.
python-preference = "system"
